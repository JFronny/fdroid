Summary: An Android Anilist client which lets you stream & download Anime & Manga
Description: |-
    Dantotsu is an Anilist client based on Saikou. It lets you stream-download Anime & Manga through extensions.

    Dantotsu (断トツ; Dan-totsu) literally means "the best of the best" in Japanese.

    APP FEATURES:

    * Easy and functional way to both, watch anime and read manga.
    * A completely open source app with a nice UI & Animations.
    * Aniyomi extension support built right into the app.
    * Synchronize anime and manga real-time with AniList and MyAnimeList. Easily categorise anime and manga based on your current status.
    * Find all shows using thoroughly and frequently updated list of all trending, popular and ongoing anime based on scores.
    * View extensive details about anime shows, movies and manga titles. Countdown to the next episode of airing anime.
    * Get notified when new episodes/chapters are released!

