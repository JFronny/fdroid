Summary: A Free, Open source unofficial manga reader for MangaDex
Description: |-
    Neko is a free, open source unofficial manga reader for MangaDex.

    Features include:

    * MangaDex manga reader for Android 8+
    * Supports native login to MangaDex and 2FA
    * Offline reading
    * MDList support
    * Tracker support: MyAnimeList, AniList, Kitsu, MangaUpdates, and MangaBaka
    * Custom computer generated similar manga recommendations, as well as user recommendations
    * Syncing manga and read statuses to and from MangaDex and Neko
    * Ability to merge missing chapters from MangaDex with other sources including Atsumaru, Toonily, Weeb Central, Project Suki, Comix, and Komga

