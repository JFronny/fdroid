Summary: Adfree FOSS Android app for downloading and reading novels
Description: |-
    QuickNovel is an adfree FOSS Android app for downloading novels. It also functions as an Epub reader.

    The app crawls and aggregates content from multiple third-party sources including Anna's Archive, Royal Road, Scribble Hub, Light Novel World, and many more.

    Legal notice: QuickNovel does not host any content on the app, and has no control over what media is uploaded. It functions like a search engine, crawling and displaying links from publicly accessible websites.

