Summary: Android app for streaming Movies, TV-Series and Anime with extensions (Prerelease)
Description: |-
    CloudStream is a media center that prioritizes and emphasizes complete freedom and flexibility for users and developers. This application is the automatically generated preview build and may not be as stable as the releases.

    CloudStream is an extension-based multimedia player with tracking support. By default, this app doesn't provide any video sources; you have to install extensions to add functionality.

    FEATURES:

    * AdFree, No ads whatsoever
    * No tracking/analytics
    * Bookmarks
    * Phone and TV support
    * Chromecast
    * Extension system for personal customization

    Important: CloudStream does not host any content.

